name: Build SmartPC Linux Edition APK

on:
  push:
    branches:
      - feature/linux-engine-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smartpc-linux:
    name: Build SmartPC with working Linux engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SmartPC workflow repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-37.2" "build-tools;37.0.0" "cmake;3.22.1"

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure HTTPS for upstream submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Download Linux engine source and initialize HTTPS submodules
        run: |
          git clone --depth 1 https://github.com/oonid/pr.git linux-engine
          cd linux-engine
          sed -i 's#git@github.com:#https://github.com/#g' .gitmodules
          git submodule sync
          git -c protocol.version=2 submodule update --init --depth 1

      - name: Build Android ARM64 PRoot engine
        working-directory: linux-engine
        run: |
          chmod +x scripts/build.sh scripts/build-pr-cli.sh
          scripts/build.sh --arch=arm64

      - name: Build pr-cli native executable
        working-directory: linux-engine
        run: scripts/build-pr-cli.sh

      - name: Package native Linux engine libraries
        working-directory: linux-engine
        run: |
          mkdir -p android/proot-engine/src/main/jniLibs/arm64-v8a
          cp build/out/arm64/proot android/proot-engine/src/main/jniLibs/arm64-v8a/libproot.so
          cp build/out/arm64/loader android/proot-engine/src/main/jniLibs/arm64-v8a/libproot-loader.so
          test -s android/proot-engine/src/main/jniLibs/arm64-v8a/libpr-cli.so
          ls -lh android/proot-engine/src/main/jniLibs/arm64-v8a/

      - name: Add one-tap XFCE desktop setup for installed Linux distros
        working-directory: linux-engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ops = Path("android/app/src/main/java/id/or/oo/pr/DistroOperations.kt")
          s = ops.read_text()
          s = s.replace('enum class Kind(val label: String) { Install("Installing"), Remove("Removing"), Test("Testing") }',
                        'enum class Kind(val label: String) { Install("Installing"), Remove("Removing"), Test("Testing"), Desktop("Preparing desktop") }')
          needle = '''    fun test(alias: String, displayName: String): Boolean =
          start(Operation(Kind.Test, alias, displayName, emptyList(), true)) {
              execute(listOf("test", alias))
          }
          '''
          addition = needle + '''
          fun setupDesktop(alias: String, displayName: String): Boolean =
              start(Operation(Kind.Desktop, alias, displayName, emptyList(), true)) {
                  execute(listOf("login", alias, "--user", "root", "--", "sh", "-lc", DESKTOP_SETUP_SCRIPT))
              }
          '''
          if needle not in s:
              raise SystemExit("Could not locate DistroOperations.test insertion point")
          s = s.replace(needle, addition, 1)
          marker = '''    companion object {
        fun isValidOverrideAlias(alias: String): Boolean {'''
          script = '''    companion object {
        private const val DESKTOP_SETUP_SCRIPT = """
            set -e
            export DEBIAN_FRONTEND=noninteractive
            dpkg --configure -a
            apt-get update
            apt-get install -y xfce4 xfce4-terminal tigervnc-standalone-server dbus-x11
            mkdir -p /root/.vnc
            printf '%s\\n' '#!/bin/sh' 'unset SESSION_MANAGER' 'unset DBUS_SESSION_BUS_ADDRESS' 'exec startxfce4' > /root/.vnc/xstartup
            chmod 700 /root/.vnc
            chmod +x /root/.vnc/xstartup
            echo 'XFCE desktop and TigerVNC are installed.'
            echo 'A VNC viewer is needed to display the desktop; start the server after setting a VNC password.'
        """

        fun isValidOverrideAlias(alias: String): Boolean {'''
          if marker not in s:
              raise SystemExit("Could not locate DistroOperations companion object")
          s = s.replace(marker, script, 1)
          ops.write_text(s)

          main = Path("android/app/src/main/java/id/or/oo/pr/MainActivity.kt")
          s = main.read_text()
          old = '''                        onRemove = { app.operations.remove(distro.alias, distro.displayName) },
                        onTest = { app.operations.test(distro.alias, distro.displayName) },
                    )'''
          new = '''                        onRemove = { app.operations.remove(distro.alias, distro.displayName) },
                        onTest = { app.operations.test(distro.alias, distro.displayName) },
                        onDesktopSetup = { app.operations.setupDesktop(distro.alias, distro.displayName) },
                    )'''
          if old not in s:
              raise SystemExit("Could not locate DistroCard call site")
          s = s.replace(old, new, 1)
          old = '''    onRemove: () -> Unit,
    onTest: () -> Unit,
) {'''
          new = '''    onRemove: () -> Unit,
    onTest: () -> Unit,
    onDesktopSetup: () -> Unit,
) {'''
          if old not in s:
              raise SystemExit("Could not locate DistroCard callback signature")
          s = s.replace(old, new, 1)
          old = '''                            DropdownMenuItem(
                                text = { Text("Test") },
                                leadingIcon = {
                                    Icon(Icons.Default.BugReport, contentDescription = null)
                                },
                                onClick = {
                                    showMenu = false
                                    onTest()
                                }
                            )
                            HorizontalDivider()'''
          new = '''                            DropdownMenuItem(
                                text = { Text("Test") },
                                leadingIcon = {
                                    Icon(Icons.Default.BugReport, contentDescription = null)
                                },
                                onClick = {
                                    showMenu = false
                                    onTest()
                                }
                            )
                            DropdownMenuItem(
                                text = { Text("Install XFCE desktop") },
                                leadingIcon = {
                                    Icon(Icons.Default.PlayArrow, contentDescription = null)
                                },
                                onClick = {
                                    showMenu = false
                                    onDesktopSetup()
                                }
                            )
                            HorizontalDivider()'''
          if old not in s:
              raise SystemExit("Could not locate distro overflow menu insertion point")
          s = s.replace(old, new, 1)
          main.write_text(s)
          PY

      - name: Brand the functional Linux app as SmartPC
        working-directory: linux-engine/android
        run: |
          sed -i 's/applicationId = "id.or.oo.pr"/applicationId = "com.smartpc.mobile"/' app/build.gradle.kts
          sed -i 's/<string name="app_name">PR<\//<string name="app_name">SmartPC<\//' app/src/main/res/values/strings.xml

      - name: Build SmartPC Linux Android APK
        working-directory: linux-engine/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK contains native Linux engine
        working-directory: linux-engine/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/(libptyjni.so|libproot.so|libpr-cli.so)'
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload SmartPC Linux APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPC-Linux-APK
          path: linux-engine/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
