name: Build SmartPC Linux Edition APK

on:
  push:
    branches:
      - feature/linux-engine-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smartpc-linux:
    name: Build SmartPC with working Linux engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SmartPC workflow repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "cmake;3.22.1"

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configure HTTPS for upstream submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Download complete Linux engine and Android application
        run: git clone --recurse-submodules --depth 1 https://github.com/oonid/pr.git linux-engine

      - name: Build Android ARM64 PRoot engine
        working-directory: linux-engine
        run: |
          chmod +x scripts/build.sh scripts/build-pr-cli.sh
          scripts/build.sh --arch=arm64

      - name: Build pr-cli native executable
        working-directory: linux-engine
        run: scripts/build-pr-cli.sh

      - name: Brand the functional Linux app as SmartPC
        working-directory: linux-engine/android
        run: |
          sed -i 's/applicationId = "id.or.oo.pr"/applicationId = "com.smartpc.mobile"/' app/build.gradle.kts
          sed -i 's/<string name="app_name">PR<\//<string name="app_name">SmartPC<\//' app/src/main/res/values/strings.xml

      - name: Build SmartPC Linux Android APK
        working-directory: linux-engine/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK contains native Linux engine
        working-directory: linux-engine/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/(libptyjni.so|libproot.so|libpr-cli.so)'
          echo "APK size: $(du -h "$APK" | cut -f1)"

      - name: Upload SmartPC Linux APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPC-Linux-APK
          path: linux-engine/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
