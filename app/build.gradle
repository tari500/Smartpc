plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.smartpc.mobile'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // Separate package ID avoids signature/update conflicts with earlier SmartPC APKs.
        applicationId 'com.smartpc.mobile.client'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}
